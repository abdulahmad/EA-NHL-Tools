<!doctype html>
<!-- One sprite editor for skaters, goalies and Genesis exclusives (Abdul pt1006u/pt1007u). Launch: python3 sprite-textures/editor/launch.py
     It opens on a worst-first fix queue; data comes from data/bundle.js (built locally by build_bundle.py, gitignored). -->
<html><head><meta charset="utf-8"><title>Sprite editor</title>
<style>
body{background:#161616;color:#f2f2f2;font:16px sans-serif;margin:10px}
button,select{font:bold 15px sans-serif;margin:2px;padding:5px 9px;border:2px solid #666;background:#2c2c2c;color:#fff;cursor:pointer}
button.on{border-color:#ffe000;background:#4a4520}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#item{font-size:20px;font-weight:bold}#why{margin:6px 0;font-size:16px}
.chip{display:inline-block;background:#333;border:1px solid #888;border-radius:4px;padding:2px 7px;margin:2px}
#grid{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;column-gap:22px;margin-top:8px}
.h{text-align:center;font-weight:bold;font-size:17px;padding:4px 0;border-bottom:2px solid #777;margin-bottom:6px}
.c{text-align:center}
canvas{image-rendering:pixelated;background:#3a3a3a;border:1px solid #777}
#legend{margin-top:10px;font-size:15px;line-height:1.8}
.sw{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin:0 6px 0 14px;border:1px solid #000}
.small{font-size:13px;color:#ccc}
</style></head><body>
<div id="bar"><span id="item">loading…</span>
<button id="prev">&larr; prev (A)</button><button id="next">next (D) &rarr;</button>
<select id="q" title="fix queue, worst first"></select>
<label>texture <select id="tsel"></select></label>
<button id="ovl" class="on">labels (O)</button><button id="jt" class="on">skeleton (J)</button>
<button id="undo">undo (Z)</button><button id="reset">reset frame</button><button id="save">save (S)</button><span id="st" class="small"></span></div>
<div id="why"></div><div id="parts"></div>
<div id="grid">
 <div class="h">Edit: labels + skeleton</div><div class="h">Game</div><div class="h">Texture preview</div><div class="h">Texture</div>
 <div class="c"><canvas id="ed"></canvas></div><div class="c"><canvas id="pg"></canvas></div><div class="c"><canvas id="pt"></canvas></div><div class="c"><canvas id="tx"></canvas></div>
</div>
<div id="legend"></div>
<p class="small">Click/drag paints the selected part. Drag a ring to move a joint. Shift+click picks the part under the cursor. Keys: A/D or arrows = prev/next, O labels, J skeleton, Z undo, S save, part keys on the buttons.</p>
<script src="data/bundle.js"></script>
<script>
const B=window.BUNDLE,$=i=>document.getElementById(i),Z=12,PZ=5;
if(!B){$('item').textContent='No data bundle. Run: python3 sprite-textures/editor/launch.py --rebuild'}
// part tables reused from the old skater / goalie editors (Okabe-Ito colours, a letter on every px, no red next to green)
const PARTS={skater:[['none','',null,'x'],['outline','o','#000000','`'],['skin','k','#e69f00','1'],['helmet','H','#0072b2','2'],['torso','T','#56b4e9','3'],
 ['crest','C','#f0e442','4'],['shoulder patch','P','#cc79a7','5'],['sleeve','V','#9ad0f0','6'],['glove','G','#ffd27a','7'],['pants','N','#003a66','8'],
 ['sock','O','#ffffff','9'],['skate','K','#404040','0'],['skate blade','b','#bdbdbd','q'],['stick','S','#7a4a00','w'],['shadow','s','#6b5b95','e'],
 ['goalie mask','M','#888','r'],['catcher','c','#888','t'],['blocker','B','#888','y'],['pad','D','#888','u'],['other','?','#d0d0d0','i']],
 goalie:[['BG','',null,'x'],['body','b','#9a9a9a','1'],['Mask','M','#f0e442','2'],['Catcher','C','#56b4e9','3'],['Blocker','B','#e69f00','4'],['Stick','S','#ffffff','5'],
 ['Left pad','L','#0072b2','6'],['Right pad','R','#cc79a7','7'],['sKate','K','#000000','8'],['shadow','s','#5a3a1a','9']]};
const DARKTXT=['#000000','#0072b2','#003a66','#404040','#7a4a00','#6b5b95','#5a3a1a'];
const BCOL=(a,b)=>{const s=a+' '+b;return s.includes('stick')?(b.includes('toe')?'#f0e442':'#bdbdbd'):/(R |R)(sh|el|wr|gl|hand|Rsh|Relb)/.test(s)||/Rsh|Relb|Rhand/.test(s)?'#e69f00':/(L )(sh|el|wr|gl)|Lsh|Lelb|Lhand/.test(s)?'#56b4e9':/R (hip|kn|an|sk)|Rhip|Rknee|Rank/.test(s)?'#cc79a7':/L (hip|kn|an|sk)|Lhip|Lknee|Lank/.test(s)?'#9ad0f0':'#ffffff'};
let qi=0,cur=4,ovl=true,jt=true,edits={},undo=[],drag=null,painting=false;
const Q=B?B.frames:[],fr=()=>Q[qi],get=()=>edits[fr().id]||fr();
$('q').innerHTML=Q.map((f,i)=>`<option value="${i}">${i+1}. ${f.id} (score ${f.score})</option>`).join('');
function mut(){const f=fr();if(!edits[f.id])edits[f.id]={lab:f.lab?f.lab.map(r=>r.slice()):null,joints:JSON.parse(JSON.stringify(f.joints))};return edits[f.id]}
function partsBar(){const f=fr(),P=PARTS[f.kind];$('parts').innerHTML='';if(!P||!f.lab){$('parts').innerHTML='<span class="small">Exclusive frames: skeleton joints are editable; part labels come from the pipeline.</span>';return}
 P.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=(p[2]?`<span class="sw" style="margin:0 4px 0 0;background:${p[2]}"></span>`:'')+`${p[0]} (${p[3]})`;b.id='p'+i;b.onclick=()=>pick(i);$('parts').appendChild(b)});pick(Math.min(cur,P.length-1))}
function pick(i){cur=i;document.querySelectorAll('#parts button').forEach(b=>b.classList.toggle('on',b.id=='p'+i))}
function texOpts(){const k=fr().kind=='goalie'?'goalie':'v2',T=Object.keys(B.textures).filter(n=>B.textures[n].kind==k),old=$('tsel').value;
 $('tsel').innerHTML=T.map(n=>`<option>${n}</option>`).join('');const pref=fr().kind=='exclusive'?'D175 control (shade groups)':fr().kind=='goalie'?'Goalie: Fuhr v14':'Leafs home';
 $('tsel').value=T.includes(old)?old:(T.includes(pref)?pref:T[0])}
function legend(){const f=fr();let s='<b>Legend</b><br>';
 s+='<span class="sw" style="background:#3a3a3a"></span>empty / background';
 if(f.kind=='exclusive')s+='<span class="sw" style="border:3px solid #fff;outline:2px solid #000;border-radius:50%"></span>ring: wrong control zone (texel shade group differs from the pixel\'s)<span class="sw" style="border:2px solid #00ffff;background:none"></span>cyan box: nudged 1 texel';
 s+='<span class="sw" style="background:repeating-linear-gradient(45deg,#000 0 3px,#fff 3px 6px)"></span>hatched: pixel has no texel (preview keeps game colour)<br>';
 s+='Skeleton: <span class="sw" style="background:#fff"></span>head/torso<span class="sw" style="background:#e69f00"></span>R arm<span class="sw" style="background:#56b4e9"></span>L arm<span class="sw" style="background:#cc79a7"></span>R leg<span class="sw" style="background:#9ad0f0"></span>L leg<span class="sw" style="background:#bdbdbd"></span>stick shaft<span class="sw" style="background:#f0e442"></span>blade.<span class="sw" style="background:#ffe000;border-radius:50%;border:2px solid #000"></span>joint (drag to move)';
 if(f.kind!='exclusive')s+='<br>Labels: coloured square + letter per pixel (see part buttons).';$('legend').innerHTML=s}
function sizeFor(cv,w,h,z){cv.width=w*z;cv.height=h*z;const c=cv.getContext('2d');c.fillStyle='#3a3a3a';c.fillRect(0,0,cv.width,cv.height);return c}
function hatch(c,x,y,z){c.fillStyle='#000';c.fillRect(x,y,z,z);c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();for(let d=-z;d<z;d+=3){c.moveTo(x+Math.max(0,d),y+Math.max(0,-d));c.lineTo(x+Math.min(z,d+z),y+Math.min(z,z-d))}c.stroke()}
function marks(c,f,z){(f.nud||[]).forEach(([y,x])=>{c.strokeStyle='#00ffff';c.lineWidth=1.5;c.strokeRect(x*z+.5,y*z+.5,z-1,z-1)});
 (f.err||[]).forEach(([y,x])=>{c.beginPath();c.arc((x+.5)*z,(y+.5)*z,z*.75,0,7);c.strokeStyle='#000';c.lineWidth=3;c.stroke();c.strokeStyle='#fff';c.lineWidth=1.3;c.stroke()})}
function show(){if(!B)return;const f=fr(),g=get(),pal=B.palettes[f.pal],h=f.px.length,w=f.px[0].length,T=B.textures[$('tsel').value].px;
 $('item').textContent=`${qi+1}/${Q.length}: ${f.kind=='exclusive'?'exclusive '+f.id:f.id}`+(edits[f.id]?'  (edited)':'');
 $('why').innerHTML=`<span class="small">${f.src} · score ${f.score} · </span>`+(f.why.length?f.why.map(x=>`<span class="chip">${x}</span>`).join(''):'<span class="chip">no open issues</span>');$('q').value=qi;
 const P=PARTS[f.kind],e=$('ed'),c=sizeFor(e,w,h,Z);c.textAlign='center';c.textBaseline='middle';c.font='bold 10px sans-serif';
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const s=f.px[y][x];if(s==255)continue;c.fillStyle=`rgb(${pal[s]})`;c.fillRect(x*Z,y*Z,Z,Z);
  const l=g.lab?g.lab[y][x]:0;if(ovl&&P&&l&&P[l]&&P[l][2]){c.fillStyle=P[l][2];c.globalAlpha=.75;c.fillRect(x*Z+2,y*Z+2,Z-4,Z-4);c.globalAlpha=1;c.fillStyle=DARKTXT.includes(P[l][2])?'#fff':'#000';c.fillText(P[l][1],x*Z+Z/2,y*Z+Z/2+1)}}
 marks(c,f,Z);
 if(jt){const J=g.joints,p=k=>[(J[k][0]+.5)*Z,(J[k][1]+.5)*Z];
  for(const [col,lw] of [['#000',5],[null,2.5]]){c.lineWidth=lw;f.bones.forEach(([a,b])=>{if(J[a]&&J[b]){c.strokeStyle=col||BCOL(a,b);c.beginPath();c.moveTo(...p(a));c.lineTo(...p(b));c.stroke()}})}
  for(const k in J){const [X,Y]=p(k);c.beginPath();c.arc(X,Y,5,0,7);c.fillStyle='#ffe000';c.fill();c.lineWidth=2;c.strokeStyle='#000';c.stroke()}}
 const pg=sizeFor($('pg'),w,h,PZ),pt=sizeFor($('pt'),w,h,PZ);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const s=f.px[y][x];if(s==255)continue;pg.fillStyle=`rgb(${pal[s]})`;pg.fillRect(x*PZ,y*PZ,PZ,PZ);
  const t=f.tmap[y+','+x],cc=t&&T[t[1]]&&T[t[1]][t[0]];
  if(cc&&!(cc[0]==252&&cc[1]==0&&cc[2]==252)){pt.fillStyle=`rgb(${cc})`;pt.fillRect(x*PZ,y*PZ,PZ,PZ)}else if(f.kind!='exclusive'||!t){hatch(pt,x*PZ,y*PZ,PZ)}else{pt.fillStyle=`rgb(${pal[s]})`;pt.fillRect(x*PZ,y*PZ,PZ,PZ)}}
 marks(pt,f,PZ);
 const TS=Math.max(6,Math.floor(300/T[0].length)),tc=sizeFor($('tx'),T[0].length,T.length,TS);
 for(let y=0;y<T.length;y++)for(let x=0;x<T[0].length;x++){const p=T[y][x];if(p[0]==252&&p[1]==0&&p[2]==252)continue;tc.fillStyle=`rgb(${p})`;tc.fillRect(x*TS,y*TS,TS,TS)}
 tc.strokeStyle='rgba(0,0,0,.35)';for(let x=0;x<=T[0].length;x++){tc.beginPath();tc.moveTo(x*TS+.5,0);tc.lineTo(x*TS+.5,T.length*TS);tc.stroke()}for(let y=0;y<=T.length;y++){tc.beginPath();tc.moveTo(0,y*TS+.5);tc.lineTo(T[0].length*TS,y*TS+.5);tc.stroke()}
 $('st').textContent=Object.keys(edits).length+' edited (unsaved)'}
function go(i){qi=(i+Q.length)%Q.length;texOpts();partsBar();legend();show()}
const cell=e=>{const r=$('ed').getBoundingClientRect();return[(e.clientX-r.left)/Z,(e.clientY-r.top)/Z]};
function paint(e){const f=fr();if(!f.lab)return;const [fx,fy]=cell(e),x=Math.floor(fx),y=Math.floor(fy);if(y<0||x<0||y>=f.px.length||x>=f.px[0].length||f.px[y][x]==255)return;const g=mut();if(g.lab[y][x]!=cur){g.lab[y][x]=cur;show()}}
$('ed').onmousedown=e=>{const [fx,fy]=cell(e),g=get();if(e.shiftKey&&g.lab){const v=g.lab[Math.floor(fy)][Math.floor(fx)];if(v!==undefined)pick(v);return}
 undo.push([qi,JSON.stringify(edits[fr().id]||null)]);if(jt)for(const k in g.joints){const j=g.joints[k];if(Math.hypot(j[0]+.5-fx,j[1]+.5-fy)<.6){drag=k;return}}painting=true;paint(e)};
$('ed').onmousemove=e=>{if(drag){const [fx,fy]=cell(e);mut().joints[drag]=[Math.round(fx-.5),Math.round(fy-.5)];show()}else if(painting)paint(e)};
onmouseup=()=>{drag=null;painting=false};
$('prev').onclick=()=>go(qi-1);$('next').onclick=()=>go(qi+1);$('q').onchange=e=>go(+e.target.value);$('tsel').onchange=show;
$('ovl').onclick=()=>{ovl=!ovl;$('ovl').classList.toggle('on',ovl);show()};$('jt').onclick=()=>{jt=!jt;$('jt').classList.toggle('on',jt);show()};
$('undo').onclick=()=>{const u=undo.pop();if(!u)return;qi=u[0];const id=Q[qi].id;if(u[1]=='null')delete edits[id];else edits[id]=JSON.parse(u[1]);go(qi)};
$('reset').onclick=()=>{delete edits[fr().id];show()};
$('save').onclick=async()=>{const out={};for(const id in edits){const f=Q.find(q=>q.id==id),k=f.kind=='exclusive'?id.replace(' ','_'):id.split(' ').pop();(out[f.kind]=out[f.kind]||{})[k]=edits[id]}
 try{const r=await fetch('/save',{method:'POST',body:JSON.stringify(out)});const j=await r.json();$('st').textContent='saved: '+j.saved.join('; ')}
 catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)]));a.download='sprite_edits.json';a.click();$('st').textContent='no launcher: downloaded sprite_edits.json'}};
onkeydown=e=>{if(e.target.tagName=='SELECT'||e.target.tagName=='INPUT')return;const k=e.key;
 if(k=='ArrowRight'||k=='d')go(qi+1);else if(k=='ArrowLeft'||k=='a')go(qi-1);else if(k=='o')$('ovl').click();else if(k=='j')$('jt').click();
 else if(k=='z')$('undo').click();else if(k=='s')$('save').click();else{const P=PARTS[fr().kind];if(P){const i=P.findIndex(p=>p[3]==k);if(i>=0)pick(i)}}};
if(B)go(0);
</script></body></html>
